server {
    listen 80;
    server_name badk.kg www.badk.kg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name badk.kg www.badk.kg;

    ssl_certificate     /etc/letsencrypt/live/badk.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/badk.kg/privkey.pem;

    client_max_body_size 20M;

    # Media files — served directly by nginx, bypasses gunicorn
    location /media/ {
        alias /var/lib/docker/volumes/badk-official_media_data/_data/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Static files
    location /static/ {
        alias /var/www/project/static/dist/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else goes to gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
